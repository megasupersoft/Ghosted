name: release

# Cut installers for every OS. Tag pushes (v*) publish a GitHub Release with
# the artifacts + electron-updater feed files; manual dispatch runs build-only
# and uploads artifacts for inspection.
#
# macOS is UNSIGNED for now (CSC_IDENTITY_AUTO_DISCOVERY=false): first launch
# needs right-click -> Open. Signing + notarization land when the Apple
# Developer account exists — auto-update on macOS requires it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest # untested platform — allowed to fail without blocking the release
            args: --win
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Root deps only — ghosted2/ is the web/server mode and is not packaged;
      # leaving its node_modules uninstalled also keeps electron-builder's
      # module collector away from the tree that OOMs it locally.
      - run: npm ci

      - run: npm run build

      # macOS signing + notarization activate automatically once the three
      # MAC_* secrets exist (see release docs in BUILDING.md); until then the
      # DMG builds unsigned and notarization is skipped.
      - name: Write Apple API key
        if: runner.os == 'macOS' && secrets.MAC_API_KEY_P8 != ''
        run: printf '%s' "$MAC_API_KEY_P8" > "$RUNNER_TEMP/apple_api_key.p8"
        env:
          MAC_API_KEY_P8: ${{ secrets.MAC_API_KEY_P8 }}

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          # Developer ID Application cert (.p12, base64) + its password:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12 != '' }}
          # App Store Connect API key for notarization:
          APPLE_API_KEY: ${{ secrets.MAC_API_KEY_P8 != '' && format('{0}/apple_api_key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.MAC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MAC_API_ISSUER }}
        run: npx electron-builder ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - name: Upload artifacts (non-tag runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ghosted-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
            release/*.yml
          if-no-files-found: warn
